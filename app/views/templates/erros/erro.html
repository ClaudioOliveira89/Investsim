{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block trilha %}<span>{{ titulo }}</span>{% endblock %}
{% block conteudo %}
<div class="cartao cartao--estreito cartao--centro erro-pagina">
  <p class="erro-pagina__codigo" aria-hidden="true">{{ codigo }}</p>
  <h1 class="titulo-pagina">{{ titulo }}</h1>
  <p>{{ mensagem }}</p>
  <div class="grupo-botoes grupo-botoes--centro">
    <button type="button" class="botao botao--secundario" data-voltar>Voltar</button>
    <a class="botao botao--primario" href="{{ url_for('carteiras.painel') }}">Ir para o início</a>
  </div>
</div>
{% endblock %}
