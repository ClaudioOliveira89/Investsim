[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    e2e: testes de ponta a ponta no navegador (Playwright)
    postgres: testes que exigem PostgreSQL real (TEST_PG_URL)
filterwarnings =
    ignore::DeprecationWarning:flask_login.*
    # WTForms 3.3 avisa sobre a API de choices que muda na 3.4; a versão está fixada em requirements.txt
    ignore:Passing SelectField choices as tuples:DeprecationWarning
